<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draw Results - On Chain Lotto</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 id="drawTitle">Loading...</h1>
            <p class="subtitle" id="drawSubtitle"></p>
        </header>

        <!-- Progress Bar -->
        <div class="card">
            <h3>Draw Progress</h3>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <p class="progress-text" id="progressText">0 / 69 slots filled</p>
        </div>

        <!-- Quick Overview Grid -->
        <div class="card">
            <h2>Overview Lotto Draw holders: last six digits</h2>
            <div class="numbers-grid" id="numbersGrid">
                <!-- Numbers will be generated by JavaScript -->
            </div>
        </div>

        <!-- Prize Description Card -->
        <div class="card" id="prizeDescriptionCard" style="display: none; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; margin-bottom: 2rem;">
            <h3 style="margin-bottom: 1rem; color: white;">🏆 Prize Information</h3>
            <div id="prizeDescriptionLong" style="font-size: 1.1rem; line-height: 1.6; white-space: pre-wrap;"></div>
        </div>

        <!-- Draw Info Card -->
        <div class="card draw-info">
            <div class="info-grid">
                <div class="info-item">
                    <span class="label">Token</span>
                    <span class="value" id="tokenInfo">-</span>
                </div>
                <div class="info-item">
                    <span class="label">Status</span>
                    <span class="value" id="drawStatus">-</span>
                </div>
                <div class="info-item">
                    <span class="label">Filled Slots</span>
                    <span class="value" id="filledSlots">-</span>
                </div>
                <div class="info-item">
                    <span class="label">Start Time</span>
                    <span class="value" id="startTime">-</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="themes.js"></script>
    <script src="theme-selector.js"></script>
    <script src="public-draw.js"></script>
</body>
</html>
