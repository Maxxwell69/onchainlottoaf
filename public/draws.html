<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.helius.xyz https://price.jup.ag https://mainnet.helius-rpc.com;">
    <title>Active Draws - On Chain Lotto</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <div class="home-container">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="nav-brand">
                <a href="home.html" style="text-decoration: none; color: inherit; display: flex; align-items: center;">
                    <img src="images/logo.png" alt="On Chain Lotto" class="site-logo" style="height: 50px; width: auto;" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <h1 class="logo-font" style="display: none; margin: 0;">On Chain Lotto</h1>
                </a>
            </div>
            <div class="nav-links" id="navLinks">
                <a href="home.html" class="nav-link">Home</a>
                <a href="login.html" class="btn btn-primary">Login</a>
            </div>
        </nav>

        <!-- Hero Section -->
        <section class="hero">
            <div class="hero-content">
                <h2 class="hero-subtitle">Premium Movement</h2>
                <p class="hero-description">
                    The ultimate Solana meme coin lotto system. Join the elite community 
                    and win life-changing prizes with transparent, on-chain draw.
                </p>
            </div>
            <div class="hero-visual">
                <div class="lotto-balls-demo">
                    <div class="demo-ball filled">1</div>
                    <div class="demo-ball filled">7</div>
                    <div class="demo-ball filled">23</div>
                    <div class="demo-ball filled">42</div>
                    <div class="demo-ball filled">69</div>
                </div>
            </div>
        </section>

        <!-- Active Draws Section -->
        <section id="all-draws" class="all-draws-section" style="
            padding: 2rem 2rem; 
            background: var(--card-bg); 
            margin: 1rem auto; 
            border-radius: 12px;
            max-width: 1400px;
        ">
            <div class="section-header" style="text-align: center;">
                <h2>Active Lotto Draws</h2>
                <p>View all currently active draws</p>
            </div>
            <div id="allDrawsContainer" style="
                margin: 2rem auto 0;
                display: flex;
                flex-direction: row;
                gap: 1.5rem;
                overflow-x: auto;
                padding: 1rem 0;
                scroll-behavior: smooth;
                -webkit-overflow-scrolling: touch;
                justify-content: center;
                max-width: 100%;
            ">
                <p class="loading" style="text-align: center; color: var(--text-secondary); width: 100%;">Loading draws...</p>
            </div>
        </section>
    </div>

    <script src="themes.js"></script>
    <script src="theme-selector.js"></script>
    <script src="auth.js"></script>
    <script src="draws-page.js"></script>
</body>
</html>
